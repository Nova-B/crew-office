name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 — 오래된 결과를 기다릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: 공개 트리 메타 파일 검사
        run: bash scripts/check-public-tree.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 실패해도 나머지를 계속 돌린다 — 한 번에 무엇이 깨졌는지 전부 보이는 편이
      # "고치고 다시 밀고 다음 실패를 본다"를 반복하는 것보다 싸다.
      - name: 단위 테스트
        if: always()
        run: npm run test

      - name: 타입 검사
        if: always()
        run: npm run typecheck

      # 2026-09-07 에 0으로 만들었다. 이 단계가 없는 동안 react-hooks/exhaustive-deps
      # 위반 17건이 타일 에디터에 살아 있었고, 그중 여럿이 실제 결함이었다
      # (레이어 오버레이 토글이 캔버스를 다시 그리지 않는 등).
      #
      # 경고(미사용 변수 등)로는 실패하지 않는다 — 오류만 게이트다. 경고까지 막으려면
      # 먼저 그것들을 0으로 만들어야 하고, 그건 별개의 작업이다.
      - name: 린트
        if: always()
        run: npm run lint

      # 이 저장소에서 가장 값진 게이트다. 없는 모듈을 import 하는 코드가 넉 달을
      # 살아남은 적이 있다(ec60ca2d) — 단위 테스트는 그 라우트를 import 하지 않고,
      # dev 서버는 요청된 라우트만 컴파일하므로 전체 빌드만이 그걸 본다.
      - name: 빌드
        if: always()
        run: npm run build

      - name: 포매팅
        if: always()
        run: npm run format:check
